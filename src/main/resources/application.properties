spring.application.name=optiway

# Puerto dinámico para Render con fallback en 8080 local
server.port=${PORT:8080}
# Soporte para proxy inverso HTTPS (Render, Cloudflare) para que Swagger UI no bloquee contenido mixto ni falle en redirects
server.forward-headers-strategy=framework

# Configuración estricta de orígenes CORS: Localhost, Vercel Frontend y Render
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://opti-way-frontend.vercel.app,https://*.vercel.app,https://*.onrender.com}

# Conexion a la base de datos PostgreSQL en Supabase
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.cehzzcvnkiuvkabglrzp
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Configuracion de Auth y API de Supabase
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${SUPABASE_PROJECT_REF:cehzzcvnkiuvkabglrzp}.supabase.co/auth/v1
supabase.url=https://${SUPABASE_PROJECT_REF:cehzzcvnkiuvkabglrzp}.supabase.co
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.invite-redirect-url=${SUPABASE_INVITE_REDIRECT_URL:http://localhost:8080/set-password.html}

# Endpoints de Actuator (Health check para Render)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI (desactivable via SWAGGER_ENABLED=false)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
