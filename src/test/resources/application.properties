spring.application.name=optiway-test

# Base de datos H2 en memoria compatible con PostgreSQL para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mocks / Configuración para pruebas de seguridad y Supabase
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cehzzcvnkiuvkabglrzp.supabase.co/auth/v1
supabase.url=https://cehzzcvnkiuvkabglrzp.supabase.co
supabase.service-role-key=test-dummy-service-role-key-for-testing-only
supabase.invite-redirect-url=http://localhost:8080/set-password.html
