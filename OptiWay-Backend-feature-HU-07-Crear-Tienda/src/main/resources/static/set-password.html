<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Configurar contraseña</title>
</head>

<body>
    <h1>Configura tu contraseña</h1>

    <form id="password-form">
        <label>
            Nueva contraseña
            <input id="password" type="password" minlength="8" required>
        </label>
        <br>
        <label>
            Confirmar contraseña
            <input id="confirmation" type="password" minlength="8" required>
        </label>
        <br>
        <button type="submit">Guardar contraseña</button>
    </form>

    <p id="resultado"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
        );
        const resultado = document.getElementById('resultado');

        document.getElementById('password-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmation = document.getElementById('confirmation').value;

            if (password !== confirmation) {
                resultado.textContent = 'Las contraseñas no coinciden.';
                return;
            }

            const { data } = await supabaseClient.auth.getSession();
            if (!data.session) {
                resultado.textContent = 'El enlace no es válido o ya expiró.';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) {
                resultado.textContent = 'No se pudo configurar la contraseña: ' + error.message;
                return;
            }

            resultado.textContent = 'Contraseña configurada. Redirigiendo...';
            setTimeout(() => window.location.href = '/main.html', 1000);
        });
    </script>
</body>

</html>
