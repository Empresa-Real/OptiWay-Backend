services:
  - type: web
    name: optiway-backend
    env: java
    plan: free
    region: oregon
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -XX:+UseSerialGC -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m -jar target/optiway-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m"
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_PROJECT_REF
        value: cehzzcvnkiuvkabglrzp
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_INVITE_REDIRECT_URL
        sync: false
