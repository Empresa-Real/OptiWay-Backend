# Perfil LOCAL: diagnosticos detallados. NO activar en produccion.
# Activar con: spring.profiles.active=local
logging.level.root=DEBUG
logging.level.com.example.optiway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# SQL visible solo en desarrollo (en produccion application.properties ya tiene show-sql=false).
spring.jpa.show-sql=true
