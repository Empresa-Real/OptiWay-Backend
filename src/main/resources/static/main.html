<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
</head>

<body>
    <h1 id="welcome">Cargando...</h1>
    <p id="role-message">Cargando permisos...</p>

    <p id="nav-bar">
        <a href="/main.html">Inicio</a> |
        <span id="nav-usuarios"><a href="/admin.html">Usuarios</a> | </span>
        <a href="/tiendas.html">Tiendas</a> |
        <a href="/centros-distribucion.html">Centros de Distribución</a> |
        <a href="/inventario.html">Inventario Tienda</a> |
        <a href="/ingreso-mercancia.html">Ingreso Mercancía CD</a>
    </p>

    <button id="logout" type="button">Cerrar sesión</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/nav.js"></script>
    <script>
        async function loadMainPage() {
            const authData = await window.OptiWay.initNav();
            if (!authData) return;

            const { usuario } = authData;
            if (!usuario) {
                document.getElementById('role-message').textContent =
                    'Tu cuenta todavía no tiene un usuario configurado en la aplicación.';
                return;
            }

            if (usuario.rol === 'ADMINISTRADOR') {
                window.location.href = '/admin.html';
                return;
            } else if (usuario.rol === 'ENCARGADO_TIENDA') {
                window.location.href = '/inventario.html';
                return;
            } else if (usuario.rol === 'ENCARGADO_CD') {
                window.location.href = '/ingreso-mercancia.html';
                return;
            }

            document.getElementById('welcome').textContent = 'Bienvenido, ' + usuario.nombre;
            document.getElementById('role-message').textContent =
                'Has iniciado sesión como ' + usuario.rol + '. Tienes acceso a consulta y planificación de inventarios y logística.';
        }

        loadMainPage();
    </script>
</body>

</html>
