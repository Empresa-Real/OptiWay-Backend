name: CI - Producción

on:
  push:
    branches: [produccion]

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  COBERTURA_MINIMA: 40 # obligatoria (% de líneas)

jobs:
  build:
    name: Compilar, probar y medir cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # Sonar secretless (OIDC)
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Detección de secretos (Gitleaks)
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y probar (verify)
        run: bash ./mvnw -B -ntp verify

      - name: Cobertura (mínimo obligatorio)
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          L=$(awk -F, 'NR>1{m+=$8;c+=$9} END{printf "%.2f", (m+c)?c*100/(m+c):0}' target/site/jacoco/jacoco.csv)
          echo "### 📊 Cobertura de líneas: ${L}% (mínimo ${COBERTURA_MINIMA}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v a="$L" -v b="$COBERTURA_MINIMA" 'BEGIN{exit !(a>=b)}' || {
            echo "::error title=Cobertura insuficiente::${L}% < ${COBERTURA_MINIMA}%"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: SCA - OWASP Dependency-Check (opcional, informativo)
        if: vars.SCA_ENABLED == 'true'
        run: bash ./mvnw -B -ntp org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true

      # Requiere variables SONAR_ENABLED=true y SONAR_BOUND=true. Una vez activo, bloquea.
      - name: Autenticar con SonarQube Cloud
        id: sonar-auth
        if: vars.SONAR_ENABLED == 'true' && vars.SONAR_BOUND == 'true'
        uses: SonarSource/sonarqube-auth-action@v1

      - name: Quality Gate - SonarQube Cloud
        if: vars.SONAR_ENABLED == 'true' && vars.SONAR_BOUND == 'true'
        run: >
          bash ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }}
          -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  deploy:
    name: Desplegar en Render
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {}

    steps:
      - name: Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          [ -n "$RENDER_DEPLOY_HOOK" ] || { echo "::error::Falta el secret RENDER_DEPLOY_HOOK"; exit 1; }
          HTTP=$(curl -sS -X POST "$RENDER_DEPLOY_HOOK" -o /tmp/r.json -w '%{http_code}')
          echo "HTTP $HTTP"; cat /tmp/r.json; echo
          [ "${HTTP:0:1}" = "2" ] || { echo "::error::Render respondió HTTP $HTTP"; exit 1; }
          echo "### 🚢 Deploy disparado en Render (HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"

      # Opcional: define la variable HEALTH_URL (p. ej. https://app.onrender.com/actuator/health)
      - name: Smoke test
        if: vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          sleep 30
          for i in $(seq 1 20); do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            echo "Intento $i/20 -> HTTP $C"
            [ "$C" = "200" ] && { echo "### ✅ App arriba (HTTP 200)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 15
          done
          echo "::error::La app no respondió 200 en ~5 min"; exit 1