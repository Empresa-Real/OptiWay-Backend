<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acceso administrador</title>
</head>

<body>
    <section id="login-section">
        <h1>Acceso</h1>

        <form id="login-form">
            <label>
                Correo
                <input id="login-email" type="email" required>
            </label>
            <br>
            <label>
                Contraseña
                <input id="login-password" type="password" required>
            </label>
            <br>
            <button type="submit">Iniciar sesión</button>
        </form>
    </section>

    <p id="resultado"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/nav.js"></script>
    <script>
        // Redirigir a configurar contraseña si se recibe un token de invitación o recuperación
        if (window.location.hash && (window.location.hash.includes('type=invite') || window.location.hash.includes('type=recovery'))) {
            window.location.replace('/set-password.html' + window.location.hash);
        }

        const supabaseClient = window.OptiWay.supabase;
        const loginForm = document.getElementById('login-form');
        const resultado = document.getElementById('resultado');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            resultado.textContent = 'Iniciando sesión...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            });

            if (error) {
                resultado.textContent = 'Error de login: ' + error.message;
                return;
            }

            // Consultar perfil de usuario para redirección según rol
            const token = data.session?.access_token;
            if (!token) {
                window.location.href = '/main.html';
                return;
            }

            try {
                const response = await fetch('/api/usuarios/me', {
                    headers: { Authorization: 'Bearer ' + token }
                });

                if (response.ok) {
                    const usuario = await response.json();
                    window.location.href = window.OptiWay.getRutaInicioPorRol(usuario.rol);
                    return;
                }
            } catch (e) {
                console.error('Error al obtener rol:', e);
            }

            window.location.href = '/main.html';
        });
    </script>
</body>

</html>
