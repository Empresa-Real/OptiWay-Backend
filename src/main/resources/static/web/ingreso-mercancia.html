<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ingreso de Mercancía</title>
</head>

<body>
    <p id="nav-bar">
        <a href="/main.html">Inicio</a> |
        <span id="nav-usuarios"><a href="/admin.html">Usuarios</a> | </span>
        <span id="nav-tiendas"><a href="/tiendas.html">Tiendas</a> | </span>
        <span id="nav-cds"><a href="/centros-distribucion.html">Centros de Distribución</a> | </span>
        <span id="nav-inventario"><a href="/inventario.html">Inventario Tienda</a> | </span>
        <span id="nav-ingreso"><a href="/ingreso-mercancia.html">Ingreso Mercancía CD</a></span>
        &nbsp;&nbsp;&nbsp;
        <button id="logout" type="button">Cerrar sesión</button>
    </p>

    <h1>Registrar Ingreso de Mercancía al CD</h1>

    <form id="ingreso-form">
        <label>
            Centro de Distribución:
            <select id="select-cd" required>
                <option value="">Cargando centros...</option>
            </select>
        </label>
        <br><br>
        <label>
            ID de Producto:
            <input id="productoId" type="number" required placeholder="Ej: 1">
        </label>
        <br><br>
        <label>
            Cantidad a Ingresar:
            <input id="cantidad" type="number" required placeholder="Mayor que 0" min="1">
        </label>
        <br><br>
        <label>
            Origen / Proveedor:
            <input id="origen" type="text" required placeholder="Ej: Proveedor S.A.">
        </label>
        <br><br>
        <button type="submit">Registrar Ingreso</button>
    </form>

    <p id="resultado"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/nav.js"></script>
    <script>
        const form = document.getElementById('ingreso-form');
        const selectCd = document.getElementById('select-cd');
        const resultado = document.getElementById('resultado');

        async function getToken() {
            return window.OptiWay.getToken();
        }

        let usuarioActual = null;

        async function cargarPerfil() {
            const authData = await window.OptiWay.initNav({
                rolesPermitidos: ['ADMINISTRADOR', 'PLANIFICADOR', 'ENCARGADO_CD']
            });
            if (!authData) return;

            usuarioActual = authData.usuario;
            cargarCentrosDistribucion();
        }

        async function cargarCentrosDistribucion() {
            const token = await getToken();
            if (!token) return;

            try {
                const response = await fetch('/api/centros-distribucion', {
                    headers: { Authorization: 'Bearer ' + token }
                });

                if (!response.ok) {
                    selectCd.innerHTML = '<option value="">Error al cargar CDs</option>';
                    return;
                }

                const cds = await response.json();
                if (cds.length === 0) {
                    selectCd.innerHTML = '<option value="">No hay CDs registrados</option>';
                    return;
                }

                // Si es ENCARGADO_CD, aislar estrictamente a su CD asignado
                if (usuarioActual && usuarioActual.rol === 'ENCARGADO_CD') {
                    const misCds = cds.filter(c => c.encargadoId === usuarioActual.id);
                    if (misCds.length === 0) {
                        selectCd.innerHTML = '<option value="">[Sin CD asignado]</option>';
                        selectCd.disabled = true;
                        form.querySelector('button[type="submit"]').disabled = true;
                        resultado.textContent = '[Aviso] No tienes ningún Centro de Distribución asignado actualmente. Contacta al Administrador.';
                        return;
                    }

                    selectCd.innerHTML = misCds.map(cd =>
                        `<option value="${cd.id}">${cd.codigo || 'CD #' + cd.id} - ${cd.nombre}</option>`
                    ).join('');
                    selectCd.value = misCds[0].id;
                    if (misCds.length === 1) {
                        selectCd.disabled = true;
                    }
                    return;
                }

                // ADMINISTRADOR o PLANIFICADOR
                selectCd.innerHTML = '<option value="">-- Seleccione un Centro de Distribución --</option>' +
                    cds.map(cd => `<option value="${cd.id}">${cd.codigo || 'CD #' + cd.id} - ${cd.nombre}</option>`).join('');
            } catch (err) {
                selectCd.innerHTML = '<option value="">Error de conexión</option>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = await getToken();
            if (!token) return;

            const centroDistribucionId = parseInt(selectCd.value);
            const productoId = parseInt(document.getElementById('productoId').value);
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const origen = document.getElementById('origen').value.trim();

            resultado.textContent = 'Enviando registro...';

            try {
                const response = await fetch('/api/ingresos-mercancia', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        centroDistribucionId,
                        productoId,
                        cantidad,
                        origen
                    })
                });

                const responseText = await response.text();
                let data = null;
                try {
                    data = JSON.parse(responseText);
                } catch {}

                if (response.ok) {
                    resultado.textContent = `[OK] Ingreso registrado exitosamente. CD: ${centroDistribucionId}, Producto: ${productoId}, Cantidad: ${cantidad}`;
                    form.reset();
                    cargarCentrosDistribucion();
                } else {
                    resultado.textContent = `[Error ${response.status}] ` + (data?.error || data?.message || responseText || 'No se pudo registrar el ingreso.');
                }
            } catch (err) {
                resultado.textContent = '[Error] No se pudo comunicar con el servidor.';
            }
        });

        cargarPerfil();
    </script>
</body>

</html>
