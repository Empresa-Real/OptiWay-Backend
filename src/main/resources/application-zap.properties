# Perfil temporal y aislado para pruebas DAST con OWASP ZAP
server.port=8082

# Base de datos local en memoria: no conecta con Supabase
spring.datasource.url=jdbc:h2:mem:optiwayzap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Evita consultar el emisor y las claves JWT reales de Supabase
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:9999/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:9999/fake-jwks

# Evita conexiones reales al servicio Supabase Auth
supabase.url=http://127.0.0.1:9999
supabase.service-role-key=zap-local-fake-key
supabase.invite-redirect-url=http://localhost:8080/set-password.html

# Superficie pública para la evaluación
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoints.web.exposure.include=health,info
