<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Administración</title>
</head>

<body>
    <p id="nav-bar">
        <a href="/main.html">Inicio</a> |
        <a href="/admin.html">Usuarios</a> |
        <a href="/tiendas.html">Tiendas</a> |
        <a href="/centros-distribucion.html">Centros de Distribución</a> |
        <a href="/inventario.html">Inventario Tienda</a> |
        <a href="/ingreso-mercancia.html">Ingreso Mercancía CD</a>
        &nbsp;&nbsp;&nbsp;
        <button id="logout" type="button">Cerrar sesión</button>
    </p>

    <h1>Administración de usuarios</h1>

    <form id="usuario-form">
        <label>
            Nombre
            <input id="nombre" required>
        </label>
        <br>
        <label>
            Correo
            <input id="email" type="email" required>
        </label>
        <br>
        <label>
            Rol
            <select id="rol" required>
                <option value="ENCARGADO_TIENDA">Encargado de tienda</option>
                <option value="ENCARGADO_CD">Encargado de CD</option>
                <option value="PLANIFICADOR">Planificador</option>
            </select>
        </label>
        <br>
        <button type="submit">Invitar usuario</button>
    </form>

    <p id="resultado"></p>

    <h2>Usuarios registrados</h2>
    <button id="btn-cargar" type="button">Actualizar lista</button>
    <br><br>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Ubicación Asignada</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios-body"></tbody>
    </table>
    <!-- Sección / Modal para Asignar / Reasignar Ubicación (HU-02) -->
    <div id="modal-asignacion" style="display: none;">
        <hr>
        <h3 id="modal-titulo">Asignar Sede</h3>
        <p id="modal-tipo-desc"></p>
        
        <label>
            Ubicación:
            <select id="modal-select-ubicacion">
            </select>
        </label>
        <br><br>

        <div>
            <button type="button" onclick="ejecutarAsignacion(false, true)">
                Reasignar (Reemplaza y revoca anteriores)
            </button>
            <button type="button" onclick="ejecutarAsignacion(false, false)">
                Agregar como Sede Adicional
            </button>
            <button type="button" onclick="ejecutarAsignacion(true, false)">
                Revocar / Desasignar Todas
            </button>
            <button type="button" onclick="cerrarModalAsignacion()">
                Cancelar
            </button>
        </div>

        <p id="modal-msg"></p>
        <hr>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script src="/nav.js"></script>
    <script>
        const resultado = document.getElementById('resultado');
        const tbody = document.getElementById('tabla-usuarios-body');
        let listaTiendasGlobal = [];
        let listaCentrosGlobal = [];

        async function getToken() {
            return window.OptiWay.getToken();
        }

        async function cargarUsuarios() {
            const token = await getToken();
            if (!token) return;

            // Cargar usuarios, tiendas y centros en paralelo
            const [resUsuarios, resTiendas, resCentros] = await Promise.all([
                fetch('/api/usuarios', { headers: { Authorization: 'Bearer ' + token } }),
                fetch('/api/tiendas', { headers: { Authorization: 'Bearer ' + token } }).catch(() => ({ ok: false })),
                fetch('/api/centros-distribucion', { headers: { Authorization: 'Bearer ' + token } }).catch(() => ({ ok: false }))
            ]);

            if (!resUsuarios.ok) {
                tbody.innerHTML = '<tr><td colspan="6">Error al cargar usuarios.</td></tr>';
                return;
            }

            const usuarios = await resUsuarios.json();
            listaTiendasGlobal = resTiendas.ok ? await resTiendas.json() : [];
            listaCentrosGlobal = resCentros.ok ? await resCentros.json() : [];

            if (usuarios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No hay usuarios registrados.</td></tr>';
                return;
            }

            tbody.innerHTML = usuarios.map(u => {
                const esAdmin = u.rol === 'ADMINISTRADOR';

                // Determinar ubicaciones asignadas (puede tener 1, 2 o más)
                let ubicacionTexto = 'N/A (Global)';
                let botonAsignar = '';

                const tiendasAsignadas = listaTiendasGlobal.filter(t => t.encargadoId === u.id);
                const cdsAsignados = listaCentrosGlobal.filter(c => c.encargadoId === u.id);

                if (u.rol === 'ENCARGADO_TIENDA') {
                    if (tiendasAsignadas.length === 0) {
                        ubicacionTexto = '[Sin asignar]';
                    } else if (tiendasAsignadas.length === 1) {
                        const t = tiendasAsignadas[0];
                        ubicacionTexto = `Tienda: ${t.codigo || 'ID:' + t.id} - ${t.nombre}`;
                    } else {
                        ubicacionTexto = tiendasAsignadas.map(t => `• Tienda: ${t.codigo || 'ID:' + t.id} - ${t.nombre}`).join('<br>');
                    }
                    botonAsignar = `<br><button type="button" onclick="reasignarTienda(${u.id}, '${u.nombre}')">Gestionar Tiendas (${tiendasAsignadas.length})</button>`;
                } else if (u.rol === 'ENCARGADO_CD') {
                    if (cdsAsignados.length === 0) {
                        ubicacionTexto = '[Sin asignar]';
                    } else if (cdsAsignados.length === 1) {
                        const c = cdsAsignados[0];
                        ubicacionTexto = `CD: ${c.codigo || 'ID:' + c.id} - ${c.nombre}`;
                    } else {
                        ubicacionTexto = cdsAsignados.map(c => `• CD: ${c.codigo || 'ID:' + c.id} - ${c.nombre}`).join('<br>');
                    }
                    botonAsignar = `<br><button type="button" onclick="reasignarCD(${u.id}, '${u.nombre}')">Gestionar CD (${cdsAsignados.length})</button>`;
                }

                const botonCambiarRol = `<button type="button" onclick="cambiarRolUsuario(${u.id}, '${u.rol}')">Cambiar Rol</button>`;

                const botonEliminar = esAdmin
                    ? `<button type="button" disabled title="Un administrador no puede ser eliminado">Eliminar</button>`
                    : `<button type="button" onclick="eliminarUsuario(${u.id})">Eliminar</button>`;

                return `<tr>
                    <td>${u.id}</td>
                    <td>${u.nombre}</td>
                    <td>${u.email}</td>
                    <td>${u.rol} ${botonCambiarRol}</td>
                    <td>${ubicacionTexto} ${botonAsignar}</td>
                    <td>${botonEliminar}</td>
                </tr>`;
            }).join('');
        }

        // Modal y lógica de Asignación / Reasignación de Sedes (HU-02)
        let modalUsuarioActual = null;
        let modalTipoActual = null; // 'TIENDA' o 'CD'

        function abrirModalAsignacion(usuarioId, nombreUsuario, tipo) {
            modalUsuarioActual = { id: usuarioId, nombre: nombreUsuario };
            modalTipoActual = tipo;

            document.getElementById('modal-titulo').textContent = tipo === 'TIENDA' 
                ? `Asignar / Reasignar Tiendas - ${nombreUsuario}` 
                : `Asignar / Reasignar Centro de Distribución - ${nombreUsuario}`;
            
            document.getElementById('modal-tipo-desc').textContent = tipo === 'TIENDA'
                ? 'Selecciona la tienda a asignar. Si ya estaba asignado a otra, el sistema reasignará revocando de inmediato el acceso previo, o puedes asociar múltiples sedes:'
                : 'Selecciona el CD a asignar. Si ya estaba asignado a otro, el sistema reasignará revocando de inmediato el acceso previo, o puedes asociar múltiples sedes:';

            const select = document.getElementById('modal-select-ubicacion');
            select.innerHTML = '<option value="">-- Seleccionar ubicación --</option>';

            if (tipo === 'TIENDA') {
                listaTiendasGlobal.forEach(t => {
                    const esAsignada = t.encargadoId === usuarioId;
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    opt.textContent = `${t.codigo || 'TND-' + t.id} - ${t.nombre} ${esAsignada ? ' ★ [ASIGNADA A ESTE USUARIO]' : (t.encargadoId ? ' (Asignada a ID ' + t.encargadoId + ')' : ' (Disponible)')}`;
                    select.appendChild(opt);
                });
            } else {
                listaCentrosGlobal.forEach(c => {
                    const esAsignada = c.encargadoId === usuarioId;
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.codigo || 'CD-' + c.id} - ${c.nombre} ${esAsignada ? ' ★ [ASIGNADA A ESTE USUARIO]' : (c.encargadoId ? ' (Asignada a ID ' + c.encargadoId + ')' : ' (Disponible)')}`;
                    select.appendChild(opt);
                });
            }

            document.getElementById('modal-msg').textContent = '';
            document.getElementById('modal-asignacion').style.display = 'block';
        }

        function cerrarModalAsignacion() {
            document.getElementById('modal-asignacion').style.display = 'none';
            modalUsuarioActual = null;
            modalTipoActual = null;
        }

        async function ejecutarAsignacion(desasignarTodo = false, modoExclusivo = false) {
            const token = await getToken();
            if (!token || !modalUsuarioActual) return;

            const modalMsg = document.getElementById('modal-msg');
            modalMsg.textContent = 'Procesando...';

            try {
                if (desasignarTodo) {
                    // Revocar todas las asignaciones actuales de este usuario
                    if (modalTipoActual === 'TIENDA') {
                        const asignadas = listaTiendasGlobal.filter(t => t.encargadoId === modalUsuarioActual.id);
                        for (const t of asignadas) {
                            await fetch(`/api/tiendas/${t.id}/encargado`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                                body: JSON.stringify({ encargadoId: null })
                            });
                        }
                        resultado.textContent = `[OK] Todas las tiendas desasignadas para ${modalUsuarioActual.nombre}. Acceso revocado.`;
                    } else {
                        const asignadas = listaCentrosGlobal.filter(c => c.encargadoId === modalUsuarioActual.id);
                        for (const c of asignadas) {
                            await fetch(`/api/centros-distribucion/${c.id}/encargado`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                                body: JSON.stringify({ encargadoId: null })
                            });
                        }
                        resultado.textContent = `[OK] Todos los Centros de Distribución desasignados para ${modalUsuarioActual.nombre}. Acceso revocado.`;
                    }
                    cerrarModalAsignacion();
                    cargarUsuarios();
                    return;
                }

                const ubicacionId = document.getElementById('modal-select-ubicacion').value;
                if (!ubicacionId) {
                    modalMsg.textContent = 'Seleccione una ubicación.';
                    return;
                }

                // Si se solicita reasignación exclusiva (revoca las anteriores de inmediato)
                if (modoExclusivo) {
                    if (modalTipoActual === 'TIENDA') {
                        const otrasAsignadas = listaTiendasGlobal.filter(t => t.encargadoId === modalUsuarioActual.id && t.id != ubicacionId);
                        for (const t of otrasAsignadas) {
                            await fetch(`/api/tiendas/${t.id}/encargado`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                                body: JSON.stringify({ encargadoId: null })
                            });
                        }
                    } else {
                        const otrosAsignados = listaCentrosGlobal.filter(c => c.encargadoId === modalUsuarioActual.id && c.id != ubicacionId);
                        for (const c of otrosAsignados) {
                            await fetch(`/api/centros-distribucion/${c.id}/encargado`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                                body: JSON.stringify({ encargadoId: null })
                            });
                        }
                    }
                }

                const endpoint = modalTipoActual === 'TIENDA' 
                    ? `/api/tiendas/${ubicacionId}/encargado` 
                    : `/api/centros-distribucion/${ubicacionId}/encargado`;

                const res = await fetch(endpoint, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                    body: JSON.stringify({ encargadoId: modalUsuarioActual.id })
                });

                if (res.ok) {
                    resultado.textContent = `[OK] ${modalTipoActual === 'TIENDA' ? 'Tienda' : 'CD'} asignado exitosamente a ${modalUsuarioActual.nombre}.`;
                    cerrarModalAsignacion();
                    cargarUsuarios();
                } else {
                    const err = await res.json().catch(() => ({}));
                    modalMsg.textContent = '[Error] ' + (err.error || await res.text() || 'No se pudo asignar.');
                }
            } catch (e) {
                modalMsg.textContent = '[Error] Error de conexión: ' + e.message;
            }
        }

        async function reasignarTienda(usuarioId, nombreUsuario) {
            abrirModalAsignacion(usuarioId, nombreUsuario, 'TIENDA');
        }

        async function reasignarCD(usuarioId, nombreUsuario) {
            abrirModalAsignacion(usuarioId, nombreUsuario, 'CD');
        }

        async function cambiarRolUsuario(usuarioId, rolActual) {
            const nuevoRol = prompt(
                `Cambiar rol para usuario ID ${usuarioId}\nRol actual: ${rolActual}\n\nOpciones válidas:\n- ENCARGADO_TIENDA\n- ENCARGADO_CD\n- PLANIFICADOR\n- ADMINISTRADOR\n\nEscribe el nuevo rol:`,
                rolActual
            );

            if (!nuevoRol || nuevoRol.trim() === '' || nuevoRol.trim() === rolActual) return;
            const rolLimpio = nuevoRol.trim().toUpperCase();

            const rolesValidos = ['ENCARGADO_TIENDA', 'ENCARGADO_CD', 'PLANIFICADOR', 'ADMINISTRADOR'];
            if (!rolesValidos.includes(rolLimpio)) {
                alert(`[Error] Rol "${rolLimpio}" no es válido.`);
                return;
            }

            const token = await getToken();
            if (!token) return;

            const res = await fetch(`/api/usuarios/${usuarioId}/rol`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                body: JSON.stringify({ rol: rolLimpio })
            });

            if (res.ok) {
                resultado.textContent = `[OK] Rol actualizado a ${rolLimpio} para usuario ID ${usuarioId}.`;
                cargarUsuarios();
            } else {
                const err = await res.json().catch(() => ({}));
                resultado.textContent = `[Error] ${err.message || 'No se pudo actualizar el rol.'}`;
            }
        }

        async function eliminarUsuario(id) {
            if (!confirm('¿Seguro que deseas eliminar este usuario? Se eliminará tanto de la base de datos como de Supabase Auth.')) return;
            const token = await getToken();
            if (!token) return;

            const response = await fetch('/api/usuarios/' + id, {
                method: 'DELETE',
                headers: { Authorization: 'Bearer ' + token }
            });

            if (response.ok || response.status === 204) {
                resultado.textContent = 'Usuario eliminado con éxito de la base de datos y Supabase Auth.';
                cargarUsuarios();
            } else {
                const err = await response.json().catch(() => ({}));
                resultado.textContent = 'Error: ' + (err.error || 'No se pudo eliminar el usuario.');
            }
        }

        document.getElementById('btn-cargar').addEventListener('click', cargarUsuarios);

        document.getElementById('usuario-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = await getToken();
            if (!token) return;

            const response = await fetch('/api/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + token
                },
                body: JSON.stringify({
                    nombre: document.getElementById('nombre').value,
                    email: document.getElementById('email').value,
                    rol: document.getElementById('rol').value
                })
            });

            if (response.ok) {
                resultado.textContent = '[OK] Usuario invitado exitosamente. Se ha enviado el correo de activación.';
                document.getElementById('usuario-form').reset();
                cargarUsuarios();
            } else {
                const err = await response.json().catch(() => ({}));
                resultado.textContent = '[Error] ' + (err.error || await response.text());
            }
        });
        
        async function init() {
            const authData = await window.OptiWay.initNav({
                rolesPermitidos: ['ADMINISTRADOR']
            });
            if (authData) {
                cargarUsuarios();
            }
        }

        init();
    </script>
</body>

</html>
