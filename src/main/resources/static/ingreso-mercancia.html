<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ingreso de Mercancía</title>
</head>

<body>
    <p>
        <a href="/main.html">Inicio</a> |
        <a href="/admin.html">Usuarios</a> |
        <a href="/tiendas.html">Tiendas</a> |
        <a href="/centros-distribucion.html">Centros de Distribución</a> |
        <a href="/inventario.html">Inventario Tienda</a> |
        <a href="/ingreso-mercancia.html">Ingreso Mercancía CD</a>
        &nbsp;&nbsp;&nbsp;
        <button id="logout" type="button">Cerrar sesión</button>
    </p>

    <h1>Registrar Ingreso de Mercancía al CD</h1>

    <form id="ingreso-form" style="max-width: 500px;">
        <label>
            Centro de Distribución (*):
            <select id="select-cd" required style="width: 100%;">
                <option value="">Cargando centros de distribución...</option>
            </select>
        </label>
        <br><br>
        <label>
            ID de Producto (*):
            <input id="productoId" type="number" required placeholder="Ej: 1" style="width: 100%;">
        </label>
        <br><br>
        <label>
            Cantidad a Ingresar (*):
            <input id="cantidad" type="number" required placeholder="Mayor que 0 (ej: 100)" min="1" style="width: 100%;">
        </label>
        <br><br>
        <label>
            Origen / Proveedor (*):
            <input id="origen" type="text" required placeholder="Ej: Proveedor Alimentos del Valle S.A." style="width: 100%;">
        </label>
        <br><br>
        <button type="submit">Registrar Ingreso</button>
    </form>

    <div id="resultado-contenedor" style="margin-top: 20px; padding: 10px; display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
        );

        const form = document.getElementById('ingreso-form');
        const selectCd = document.getElementById('select-cd');
        const resultadoContenedor = document.getElementById('resultado-contenedor');

        async function getToken() {
            const { data } = await supabaseClient.auth.getSession();
            const token = data.session?.access_token;
            if (!token) {
                window.location.href = '/';
                return null;
            }
            return token;
        }

        async function cargarCentrosDistribucion() {
            const token = await getToken();
            if (!token) return;

            try {
                const response = await fetch('/api/centros-distribucion', {
                    headers: { Authorization: 'Bearer ' + token }
                });

                if (!response.ok) {
                    selectCd.innerHTML = '<option value="">Error al cargar CDs (ingrese ID manualmente)</option>';
                    return;
                }

                const cds = await response.json();
                if (cds.length === 0) {
                    selectCd.innerHTML = '<option value="">No hay CDs registrados</option>';
                    return;
                }

                selectCd.innerHTML = '<option value="">-- Seleccione un Centro de Distribución --</option>' +
                    cds.map(cd => `<option value="${cd.id}">${cd.codigo || 'CD #' + cd.id} - ${cd.nombre} (Capacidad: ${cd.capacidad})</option>`).join('');
            } catch (err) {
                selectCd.innerHTML = '<option value="">Error de conexión</option>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = await getToken();
            if (!token) return;

            const centroDistribucionId = parseInt(selectCd.value);
            const productoId = parseInt(document.getElementById('productoId').value);
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const origen = document.getElementById('origen').value.trim();

            resultadoContenedor.style.display = 'block';
            resultadoContenedor.style.backgroundColor = '#e8f4fd';
            resultadoContenedor.style.border = '1px solid #b8daff';
            resultadoContenedor.innerHTML = 'Enviando registro de mercancía...';

            try {
                const response = await fetch('/api/ingresos-mercancia', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        centroDistribucionId,
                        productoId,
                        cantidad,
                        origen
                    })
                });

                const responseText = await response.text();
                let data = null;
                try {
                    data = JSON.parse(responseText);
                } catch {}

                if (response.ok) {
                    resultadoContenedor.style.backgroundColor = '#d4edda';
                    resultadoContenedor.style.border = '1px solid #c3e6cb';
                    resultadoContenedor.style.color = '#155724';
                    resultadoContenedor.innerHTML = `<strong>[OK] Ingreso registrado exitosamente</strong><br>` +
                        `Centro de Distribución ID: ${centroDistribucionId}<br>` +
                        `Producto ID: ${productoId}<br>` +
                        `Cantidad ingresada: ${cantidad} unidades<br>` +
                        `Origen: ${origen}`;
                    form.reset();
                    cargarCentrosDistribucion();
                } else {
                    resultadoContenedor.style.backgroundColor = '#f8d7da';
                    resultadoContenedor.style.border = '1px solid #f5c6cb';
                    resultadoContenedor.style.color = '#721c24';
                    resultadoContenedor.innerHTML = `<strong>[Error ${response.status}]:</strong> ` +
                        (data?.error || data?.message || responseText || 'No se pudo registrar el ingreso.');
                }
            } catch (err) {
                resultadoContenedor.style.backgroundColor = '#f8d7da';
                resultadoContenedor.style.border = '1px solid #f5c6cb';
                resultadoContenedor.style.color = '#721c24';
                resultadoContenedor.innerHTML = '<strong>[Error de conexion]:</strong> No se pudo comunicar con el servidor.';
            }
        });

        cargarCentrosDistribucion();

        document.getElementById('logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/';
        });
    </script>
</body>

</html>
